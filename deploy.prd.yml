- name: "deploy docker"
  hosts: "{{ host }}"
  serial: 1
  roles:
      - {
        role: deploy_docker,
        docker_name: "{{docker_name}}",
        docker_img: "{{image}}",
        env: "{{env}}",
        docker_ports: "{{docker_ports}}",
        volume: "{{volume}}"
      }
      - {
        role: sleep,
        sec: 20
      }
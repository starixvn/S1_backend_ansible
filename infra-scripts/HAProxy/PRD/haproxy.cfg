global
        log /dev/log    local0
        log /dev/log    local1 notice
        chroot /var/lib/haproxy
        stats socket /run/haproxy/admin.sock mode 660 level admin
        stats timeout 30s
        user haproxy
        group haproxy
        daemon

        # Default SSL material locations
        ca-base /etc/ssl/certs
        crt-base /etc/ssl/private

        # See: https://ssl-config.mozilla.org/#server=haproxy&server-version=2.0.3&config=intermediate
        ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
        ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
        ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
        log     global
        mode    http
        option  httplog
        option  dontlognull
        #timeout connect 5000
        #timeout client  50000
        #timeout server  50000
        timeout connect 60s
        timeout client 1m
        timeout server 1m
        errorfile 400 /etc/haproxy/errors/400.http
        errorfile 403 /etc/haproxy/errors/403.http
        errorfile 408 /etc/haproxy/errors/408.http
        errorfile 500 /etc/haproxy/errors/500.http
        errorfile 502 /etc/haproxy/errors/502.http
        errorfile 503 /etc/haproxy/errors/503.http
        errorfile 504 /etc/haproxy/errors/504.http

listen stats
   bind *:8080
   stats enable
   stats uri /stat
   stats refresh 30s
   stats realm Haproxy\ Statistics
   stats auth ailabadmin:1q2w3e4r

frontend frontend_nova
  bind *:80

  # Path Rule
  acl health_check path_beg /health
  acl path_membersite_api path_beg -i /api
  acl path_membersite_entpage path_sub -i /entPage # path contains entPage
  acl path_membersite_cashier path_sub -i /Cashier # path contains Cashier
  acl path_frontend_rewards path_beg -i /rewards


  # CName
  acl prd_host_frontend_desktop hdr_reg(host) -i ^www\..*$   # www cname
  acl prd_host_frontend_mobile hdr_reg(host) -i ^m\..*$      # m cname
  acl rls_host_frontend_desktop hdr_reg(host) -i ^release\..*$ # release desktop cname
  acl rls_host_frontend_mobile hdr_reg(host) -i ^mrelease\..*$ # mrelease cname


  # Aff Host
  acl affiliate_n88 hdr_dom(host) -f /etc/haproxy/DomainList/n88_domains.txt
  acl affiliate_n8b hdr_dom(host) -f /etc/haproxy/DomainList/n8b_domains.txt
  acl affiliate_n8g hdr_dom(host) -f /etc/haproxy/DomainList/n8g_domains.txt

  use_backend health_backend if health_check

  # RRL / RR
  acl rrl_host hdr_reg(host) -i ^rrl\..*$
  acl rr_host hdr_reg(host) -i ^rr\..*$

  use_backend rrl_host if rrl_host
  use_backend rrl_host if rr_host

  # PRD Condition
  use_backend prd_membersite_api if prd_host_frontend_desktop path_membersite_api # prd desktop clinet Site call api
  use_backend prd_membersite_api if prd_host_frontend_mobile path_membersite_api  # prd mobile clinet Site call api

  use_backend prd_membersite_api if prd_host_frontend_desktop path_membersite_entpage  # prd desktop entPage
  use_backend prd_membersite_api if prd_host_frontend_mobile path_membersite_entpage  # prd mobile entPage

  use_backend prd_membersite_api if prd_host_frontend_desktop path_membersite_cashier  # prd desktop Cashier
  use_backend prd_membersite_api if prd_host_frontend_mobile path_membersite_cashier  # prd mobile Cashier

  use_backend prd_rewards if path_frontend_rewards prd_host_frontend_desktop  # prd desktop go to prd rewards
  use_backend prd_rewards if path_frontend_rewards prd_host_frontend_mobile   # prd mobile go to prd rewards
  use_backend prd_nova_desktop if prd_host_frontend_desktop #go to prd desktop
  use_backend prd_nova_mobile if prd_host_frontend_mobile   #go to prd mobile


  # RLS Condition
  use_backend rls_membersite_api if rls_host_frontend_desktop path_membersite_api # rls desktop clinet Site call api
  use_backend rls_membersite_api if rls_host_frontend_mobile path_membersite_api  # rls mobile clinet Site call api

  use_backend rls_membersite_api if rls_host_frontend_desktop path_membersite_entpage  # rls desktop entPage
  use_backend rls_membersite_api if rls_host_frontend_mobile path_membersite_entpage  # rls mobile entPage

  use_backend rls_membersite_api if rls_host_frontend_desktop path_membersite_cashier  # rls desktop Cashier
  use_backend rls_membersite_api if rls_host_frontend_mobile path_membersite_cashier  # rls mobile Cashier

  use_backend rls_rewards if path_frontend_rewards rls_host_frontend_desktop  #rls desktop go to rls rewards
  use_backend rls_rewards if path_frontend_rewards rls_host_frontend_mobile   #rls mobile go to rls rewards
  use_backend rls_nova_desktop if rls_host_frontend_desktop #go to rls desktop
  use_backend rls_nova_mobile if rls_host_frontend_mobile   #go to rls mobile


  # Aff Condition
  use_backend affiliate_n88 if affiliate_n88 # affiliate Nova
  use_backend affiliate_n8b if affiliate_n8b # affiliate Bwing
  use_backend affiliate_n8g if affiliate_n8g # affiliate Goal123




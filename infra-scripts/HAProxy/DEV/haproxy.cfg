global
        log /dev/log    local0
        log /dev/log    local1 notice
        chroot /var/lib/haproxy
        stats socket /run/haproxy/admin.sock mode 660 level admin
        stats timeout 30s
        user haproxy
        group haproxy
        daemon

        # Default SSL material locations
        ca-base /etc/ssl/certs
        crt-base /etc/ssl/private

        # See: https://ssl-config.mozilla.org/#server=haproxy&server-version=2.0.3&config=intermediate
        ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
        ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
        ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
        log     global
        mode    http
        option  httplog
        option  dontlognull
        #timeout connect 5000
        #timeout client  50000
        #timeout server  50000
        timeout connect 10s
        timeout client 1m
        timeout server 1m
        errorfile 400 /etc/haproxy/errors/400.http
        errorfile 403 /etc/haproxy/errors/403.http
        errorfile 408 /etc/haproxy/errors/408.http
        errorfile 500 /etc/haproxy/errors/500.http
        errorfile 502 /etc/haproxy/errors/502.http
        errorfile 503 /etc/haproxy/errors/503.http
        errorfile 504 /etc/haproxy/errors/504.http

listen stats
   bind *:8080
   stats enable
   stats uri /stat
   stats refresh 30s
   stats realm Haproxy\ Statistics
   stats auth ailabadmin:ugK4r@w9

frontend frontend_nova
  bind *:80
  acl health_check path_beg /health
  acl host_frontend_desktop hdr_reg(host) -i ^stage\..*$ # www cname
  acl host_frontend_mobile hdr_reg(host) -i ^m\..*$      # m cname

  acl path_membersite_api path_beg -i /api
  acl path_membersite_entpage path_sub -i /entPage # path contains entPage
  acl path_membersite_cashier path_sub -i /Cashier # path contains Cashier
  acl path_frontend_rewards path_beg -i /rewards

  acl affiliate_n88 hdr_dom(host) -f /etc/haproxy/DomainList/n88_domains.txt
  acl affiliate_n8b hdr_dom(host) -f /etc/haproxy/DomainList/n8b_domains.txt
  acl affiliate_n8g hdr_dom(host) -f /etc/haproxy/DomainList/n8g_domains.txt

  use_backend health_backend if health_check

  use_backend membersite_api if host_frontend_desktop path_membersite_api # desktop clinet Site call api
  use_backend membersite_api if host_frontend_mobile path_membersite_api # mobile clinet Site call api

  use_backend membersite_api if host_frontend_desktop path_membersite_entpage  # desktop entPage
  use_backend membersite_api if host_frontend_mobile path_membersite_cashier  # mobile entPage

  use_backend membersite_api if host_frontend_desktop path_membersite_cashier  # desktop Cashier
  use_backend membersite_api if host_frontend_mobile path_membersite_cashier  # mobile Cashier

  use_backend rewards if path_frontend_rewards   #go to rewards
  use_backend desktop if host_frontend_desktop #go to desktop
  use_backend mobile if host_frontend_mobile   #go to mobile

  use_backend affiliate_n88 if affiliate_n88 # affiliate Nova
  use_backend affiliate_n8b if affiliate_n8b # affiliate Bwing
  use_backend affiliate_n8g if affiliate_n8g # affiliate Goal123

backend health_backend
  http-request return status 200

resolvers dns
  nameserver google 8.8.8.8:53
  hold valid 10s

backend membersite_api
  balance roundrobin
  option httpchk GET /health
  server membersite_api_1 dev-membersite-service-nlb-01f52db42d795e4c.elb.ap-southeast-1.amazonaws.com:80 check resolvers dns inter 5000


backend desktop
  balance roundrobin

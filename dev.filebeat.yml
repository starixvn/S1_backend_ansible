# ============================== Filebeat inputs ===============================

filebeat.inputs:
- type: log
  enabled: true
  paths:
    - E:\logs\payment\*.log
  fields:
    es_index: dev-payment
    logtype: payment
  json.keys_under_root: true
  json.add_error_key: true

- type: log
  enabled: true
  paths:
    - E:\logs\seamless\*.log
  fields:
    es_index: dev-seamless
    logtype: seamless
  json.keys_under_root: true
  json.add_error_key: true

- type: log
  enabled: true
  paths:
    - E:\logs\tpservice\*.log
  fields:
    es_index: dev-tpservice
    logtype: tpservice
  json.keys_under_root: true
  json.add_error_key: true

- type: log
  enabled: true
  paths:
    - E:\logs\member\*.log
  fields:
    es_index: dev-member
    logtype: member
  json.keys_under_root: true
  json.add_error_key: true

- type: log
  enabled: true
  paths:
    - E:\logs\memberForApp\*.log
  fields:
    es_index: dev-member
    logtype: memberForApp
  json.keys_under_root: true
  json.add_error_key: true

- type: log
  enabled: true
  paths:
    - E:\logs\tpwager\*.log
  fields:
    es_index: dev-tpwager
    logtype: tpwager
  json.keys_under_root: true
  json.add_error_key: true

- type: log
  enabled: true
  paths:
    - E:\logs\admin\*.log
  fields:
    es_index: dev-admin
    logtype: admin
  json.keys_under_root: true
  json.add_error_key: true

- type: log
  enabled: true
  paths:
    - E:\logs\common\*.log
  fields:
    es_index: dev-common
    logtype: common
  json.keys_under_root: true
  json.add_error_key: true

# ============================== Filebeat modules ==============================

filebeat.config.modules:
  path: ${path.config}/modules.d/*.yml
  reload.enabled: false

# ======================= Elasticsearch template setting =======================
setup.template.enabled: false
setup.ilm.enabled: false
ilm.enabled: false
# ------------------------------ Logstash Output -------------------------------
output.logstash:
  hosts: ["54.151.226.243:5044"]
  # index: "dev-payment"
  # Prod Porxy
  # proxy_url: 'http://10.4.194.100:3128'

# ================================= Processors =================================
processors:
  - add_host_metadata: ~
      # when.not.contains.tags: forwarded
  # - add_cloud_metadata: ~
  # - add_docker_metadata: ~
  # - add_kubernetes_metadata: ~

# ================================== Logging ===================================
logging.level: info
logging.to_files: true
logging.files:
  path: E:\logs\filebeat
  name: filebeat.log
  keepfiles: 7
  rotateeverybytes: 10485760


- name: "Docker Prune everything"
  hosts: "{{ host }}"
  serial: 1
  tasks:
    - name: "Docker Prune everything (including non-dangling images)"
      docker_prune:
        containers: yes
        images: yes
        images_filters:
          dangling: false
        networks: yes
        volumes: yes
        builder_cache: yes
      register: result
    
    - name: "result"
      debug:
        msg:  "{{ result }}"
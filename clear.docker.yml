- name: "Docker Prune everything"
  hosts: "{{ host }}"
  serial: 1
  tasks:
    - name: "Docker Prune everything"
      docker_prune:
        containers: yes
        images: yes
        networks: yes
        volumes: yes
        builder_cache: yes
      register: result
    
    - name: "display logs"
      debug:
        msg:  "{{ result }}"
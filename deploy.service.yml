- name: "Deploy {{ site }}"
  hosts: "{{ host }}"
  serial: 1
  tasks:
      - name: "Down {{ Version }} to target machine"
        win_get_url:
          url: "http://13.213.82.69:8081/repository/artifacts/{{ proj }}/{{ pack }}-{{ Version }}.zip"
          dest: "E:\\deploy temp\\{{ site }}.zip"

      - name: Check Task
        win_command: tasklist |find /i "{{ site }}.exe"
        register: taskId

      - name: Stop  Service - {{ site }}
        win_command: "taskkill /f /t /im {{ site }}.exe"
        when: taskId.stderr != ""

      - name: "Clean Artifact E:\\{{ dest_path }}"
        win_shell: "Remove-Item –path {{ dest_path }} –recurse -force" #force = does the trick of what i want, delete the folder and all his files even if some of the files are in use or open in any program.
        args:
          chdir: "E:\\{{ dest_path }}"
          removes: "E:\\{{ dest_path }}" #checks if the folder exists else skips the task

      - name: "Deploy {{ site }} Package"
        win_unzip:
          src: "E:\\deploy temp\\{{ site }}.zip"
          dest: "E:\\{{ site }}"
          delete_archive: True

      - name: Start Service - {{ site }}
        win_command: "cmd \/c start  {{ site }}.exe"
        args:
            chdir: "E:\\{{ site }}"
        async: 10
        poll: 0


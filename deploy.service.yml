- name: "Deploy {{ site }}"
  hosts: "{{ host }}"
  serial: 1
  tasks:
      - name: "Down {{ Version }} to target machine"
        win_get_url:
          url: "http://13.213.82.69:8081/repository/artifacts/{{ proj }}/{{ pack }}-{{ Version }}.zip"
          dest: "E:\\deploy temp\\{{ site }}.zip"

      - name: Check Task
        win_command: tasklist /FI "IMAGENAME eq {{site}}.exe" /FO LIST
        register: taskId

      - name: Stop  Service - {{ site }}
        win_command: "taskkill /f /t /im {{ site }}.exe"
        when: taskId.stdout_lines|length>1

      - name: "Check {{ dest_path }} is exist"
        win_stat:
          path: "{{ dest_path }}"
        register: folder_info

      - name: "Clean Artifact {{ dest_path }}"
        win_shell: "Remove-Item –path {{ dest_path }}\\* –recurse -force -exclude *.log" #force = does the trick of what i want, delete the folder and all his files even if some of the files are in use or open in any program.
        when: folder_info.stat.exists

      - name: "Deploy {{ site }} Package"
        win_unzip:
          src: "E:\\deploy temp\\{{ site }}.zip"
          dest: "E:\\{{ site }}"
          delete_archive: True

      - name: Start Service - {{ site }}
        win_command: "cmd \/c start  {{ site }}.exe"
        args:
            chdir: "E:\\{{ site }}"
        async: 10
        poll: 0

      - name: Check {{ site }} is running
        win_command: tasklist /FI "IMAGENAME eq {{site}}.exe" /FO LIST
        register: result_taskId

      - name: Report status of {{ site }}
        fail:
          msg: |
            {{ site }} is not running. Message: {{ result_taskId.stdout }}
        when: result_taskId.stdout_lines|length<1
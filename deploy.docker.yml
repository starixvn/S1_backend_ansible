- name: "deploy docker"
  hosts: "{{ host }}"
  serial: 1
  vars:
    env: "{{env}}"
    url: "13.213.82.69:8082"
  tasks:
    - name: "Docker login {{url}}"
      docker_login:
        registry_url: "{{url}}"
        username: "admin"
        password: "123456"

    - name: "Pull an image {{url}}"
      docker_image:
        name: "{{url}}/{{ver}}"
        source: pull

    - name: Get infos on container
      docker_container_info:
        name: "{{ docker_name }}"
      register: result

    - name: "Stop Docker images"
      docker_container:
        name: "{{ docker_name }}"
        state: stopped
      when: result.exists

    - name: "Remove Docker images"
      docker_container:
        name: "{{ docker_name }}"
        state: absent
      when: result.exists

    - name: "Run Docker images {{url}}"
      docker_container:
        name: "{{ docker_name }}"
        image: "{{url}}/{{ver}}"
        state: started
        env: 
          ASPNETCORE_ENVIRONMENT: "{{env}}"
          ServiceType: "{{service_type | default('API')}}"
        ports: "{{ docker_ports | default([]) }}"
        restart_policy: always
        volumes:
           - "{{ volume | default([]) }}"

    - name: "Sleep for 20 seconds"
      wait_for:
        delay: 20
        timeout: 0
      when: (env == "Production") or (env == "Production.APP")

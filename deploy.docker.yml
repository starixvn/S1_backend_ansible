- name: "deploy docker"
  hosts: "{{ host }}"
  serial: 1
  tasks:
    - name: "login"
      docker_login:
        registry_url: "13.213.82.69:8082"
        username: "admin"
        password: "123456"

    - name: "Run Docker images"
      docker_container:
        name: "{{proj}}"
        image: "13.213.82.69:8082/{{proj}}:{{ver}}"
        state: started
        env: "ASPNETCORE_ENVIRONMENT={{env}}"
        ports: "{{port}}:80"
        volumes:
           - /logs/{{proj}}:/{{proj}}
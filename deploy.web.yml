- name: "Deploy {{ site }}"
  hosts: "{{ host }}"
  serial: 1
  vars:
    sitename: "{{ site }}"
  tasks:
      - name: "Down {{ Version }} to target machine"
        win_get_url:
          url: "http://13.213.82.69:8081/repository/artifacts/{{ pack }}/{{ pack }}-{{ Version }}.zip"
          dest: "E:\\deploy temp\\{{ site }}.zip"

      - name: "Stop Application Pool - {{ site }}"
        win_iis_webapppool:
          name: "{{ site }}"
          state: "stopped"

      - name: "Clean Artifact {{dest_path}}"
        win_file:
          dest: "{{dest_path}}"
          state: absent

      - name: "Deploy {{ site }} Package"
        win_unzip:
          src: "E:\\deploy temp\\{{ site }}.zip"
          dest: "{{dest_path}}"
          delete_archive: True
      
      - name: "Delete {{ site }} appsettings.Development.json"
        win_shell: Remove-Item E:\membersiteapp\appsettings.Development.json
        when: sitename == "MemberApp"
      
      - name: "Rename {{ site }} appsettings.Development.APP.json"
        win_shell: Rename-Item E:\membersiteapp\appsettings.Development.APP.json appsettings.Development.json
        when: sitename == "MemberApp"

      - name: "Start Application Pool - {{ site }}"
        win_iis_webapppool:
          name: "{{ site }}"
          state: "started"
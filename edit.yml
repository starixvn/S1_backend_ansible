- name: "update filebeat"
  hosts: "{{ host }}"
  serial: 2
  tasks:
    - name: copy filebeat.yml
      copy:
        src: infra-scripts/filebeat/prod.docker.filebeat.yml
        dest: /home/jenkins/test.yml
        force: yes
      become: true

    - name: Replace a localhost entry with our own
      lineinfile:
        path: /home/jenkins/test.yml
        regexp: '^10\.4\.194\.26'
        line: "{{ansible_host}}"
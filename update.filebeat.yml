- name: "update filebeat"
  hosts: "{{ host }}"
  serial: 2
  tasks:
    - name: copy filebeat.yml
      ansible.builtin.copy:
        src: /infra-scripts/filebeat/prod.docker.filebeat.yml
        dest: /usr/share/filebeat/filebeat.yml
        owner: root
        group: root
        mode: '0644'

    - name: restart filebeat
      docker_container:
        name: "filebeat"
        restart: yes